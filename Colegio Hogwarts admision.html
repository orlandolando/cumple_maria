<html lang="es">
<head>
<meta charset="utf-8">
<title>Carta de admisión · Colegio Hogwarts</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0907;--paper:#e8d6ac;--ink:#33230f;--gold:#d4af37;--hc:#d4af37;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#f3e7c9;font-family:"IM Fell English",Georgia,serif;font-size:18px}
button,input{font:inherit}
.cr{min-height:100vh;display:grid;place-items:center;padding:24px 14px;background:radial-gradient(ellipse at 50% 0,#1b2347 0,#0b0907 70%)}
.card{width:min(94vw,520px);background:linear-gradient(160deg,#ecdcb4,#d9c28f);color:var(--ink);padding:30px 28px;border-radius:4px;box-shadow:0 20px 60px #000a,inset 0 0 60px #8a6a2c55}
.card h1{font:700 26px Cinzel,serif;margin:0 0 4px;text-align:center}
.card p{margin:0 0 16px;text-align:center;font-style:italic}
.card label{display:block;margin:12px 0 0;font-size:15px}
.card input{display:block;width:100%;margin-top:4px;padding:10px 12px;background:#f6ebcc;border:1px solid #8a6a2c;border-radius:3px;color:var(--ink)}
.btn{display:inline-block;margin-top:16px;padding:11px 18px;background:#5c1010;color:#f6e7bd;border:1px solid var(--gold);border-radius:3px;font:500 15px Cinzel,serif;cursor:pointer;text-decoration:none}
.btn:hover{background:#7a1616}
.btn.alt{background:#3a2a12}
.err{color:#8a1010;min-height:20px;margin:8px 0 0!important}
#out .row{display:flex;flex-wrap:wrap;gap:8px}
.stage{position:fixed;inset:0;overflow:hidden;background:#000;cursor:pointer;user-select:none;-webkit-user-select:none}
.cam{position:absolute;inset:0;transition:transform 4.5s cubic-bezier(.5,0,.2,1);transform-origin:50% 62%;z-index:1}
.stage[data-cam="1"] .cam{transform:scale(1.15)}
.stage[data-cam="2"] .cam{transform:scale(1.5) translateY(-3%)}
.stage[data-cam="3"] .cam{transform:scale(1.9) translateY(-13%)}
.bg{position:absolute;inset:0;width:100%;height:100%}
.candle{position:absolute;width:3px;height:12px;background:#f5ecd0;animation:bob var(--d) ease-in-out infinite alternate}
.candle:before{content:"";position:absolute;left:50%;top:-10px;width:6px;height:10px;margin-left:-3px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(#fff6c8,#ffb347 60%,transparent);box-shadow:0 0 14px 6px #ffa83c70;animation:fl .15s infinite alternate}
@keyframes bob{to{transform:translateY(12px)}}
@keyframes fl{to{transform:scale(1.2,.88);opacity:.8}}
.mc,.stool{position:absolute;opacity:0;transition:opacity 1.6s}
.mc.on,.stool.on{opacity:1}
.mc{left:34%;bottom:21%;width:28vh;filter:drop-shadow(0 0 22px #ffae4a66);animation:br 4s ease-in-out infinite alternate}
.stool{left:50%;margin-left:-16vh;bottom:3%;width:32vh}
@keyframes br{to{transform:translateY(-4px) scale(1.01)}}
.hat{position:absolute;left:-6%;top:0;width:112%;height:52vh;z-index:3;transform:translateY(-125%);transition:transform 3.2s cubic-bezier(.3,0,.2,1);filter:drop-shadow(0 18px 24px #000)}
.hat.down{transform:translateY(-6%)}
.hat svg{width:100%;height:100%}
.mouth{transform-origin:50% 50%;transform-box:fill-box}
.talk .mouth{animation:mo .22s infinite alternate}
@keyframes mo{to{transform:scaleY(2.6)}}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 2.5s;background:radial-gradient(ellipse at 50% 62%,transparent 12%,#000 78%)}
.vig.on{opacity:.93}
.fade{position:absolute;inset:0;z-index:4;background:#000;opacity:1;pointer-events:none;transition:opacity 1s}
.sub{position:absolute;z-index:5;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);transform:translateX(-50%);width:min(92vw,780px);padding:16px 24px 14px;background:#0c0804cc;border:1px solid #d4af3759;backdrop-filter:blur(4px);opacity:0;transition:opacity .6s}
.sub.on{opacity:1}
.sub b{display:block;font:500 14px Cinzel,serif;color:var(--gold);min-height:18px;letter-spacing:.06em}
.sub.hv b{color:#e0a96a}
.sub.hv p{font-style:italic;color:#f0d9b0}
.sub p{margin:6px 0 4px;font-size:clamp(17px,2.3vw,24px);line-height:1.5;min-height:3em}
.sub i{display:block;text-align:right;font-size:13px;opacity:0;transition:opacity .5s;color:#b9a679}
.sub.shout{background:none;border:0;backdrop-filter:none;bottom:34vh;text-align:center}
.sub.shout b,.sub.shout i{display:none}
.sub.shout p{font:700 clamp(40px,10vw,110px) Cinzel,serif;color:var(--hc);text-shadow:0 0 30px var(--hc),0 4px 0 #000;font-style:normal;line-height:1.1}
#snd{position:absolute;z-index:9;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;width:42px;height:42px;border-radius:50%;background:#0009;border:1px solid #d4af3780;color:#fff;font-size:18px;cursor:pointer}
#bk{position:absolute;z-index:9;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;height:42px;padding:0 14px;border-radius:21px;background:#0009;border:1px solid #d4af3780;color:#f3e7c9;font:500 14px Cinzel,serif;cursor:pointer}
.env{position:absolute;inset:0;z-index:7;display:grid;place-items:center;padding:16px;background:radial-gradient(ellipse at 50% 40%,#2b1a0c,#080604);overflow:auto;cursor:default}
.paper{width:min(92vw,540px);background:linear-gradient(150deg,#efdfb8,#d6bd86);color:var(--ink);padding:34px 30px;border-radius:3px;box-shadow:0 24px 70px #000,inset 0 0 70px #7a5a1f66;text-align:center;line-height:1.5}
.paper h2{font:700 19px Cinzel,serif;margin:0 0 4px}
.paper .to{font-size:22px;margin:22px 0 6px}
.paper.open{text-align:left;font-size:17px;animation:unf 1.2s ease-out}
.paper.open h2{text-align:center}
@keyframes unf{from{transform:scaleY(.2);opacity:0}}
.seal{width:84px;height:84px;margin:12px auto 0;border-radius:50%;border:0;cursor:pointer;background:radial-gradient(circle at 35% 30%,#c42b2b,#6b0909 70%);color:#f0c46a;font:700 40px Cinzel,serif;box-shadow:0 6px 14px #0008,inset 0 0 12px #000a;animation:pu 2s infinite alternate}
@keyframes pu{to{transform:scale(1.07)}}
.end{position:absolute;inset:0;z-index:8;display:none;place-items:center;padding:16px;overflow:auto;background:radial-gradient(ellipse at 50% 30%,var(--c1),#050403 80%);cursor:default}
.end.on{display:grid}
.end .in{width:min(94vw,520px);text-align:center;animation:unf 1.4s ease-out}
.crest{width:110px;margin:0 auto 6px}
.end h2{font:700 clamp(26px,6vw,40px) Cinzel,serif;margin:6px 0;color:var(--c2)}
.end ul{list-style:none;padding:0;margin:14px 0}
.end li{margin:5px 0;font-style:italic}
.end small{display:block;opacity:.8;margin:6px 0}
.end .btn{background:#0008;margin:6px 4px 0}
.spark{position:absolute;z-index:6;width:5px;height:5px;border-radius:50%;background:#ffd76a;box-shadow:0 0 8px #ffc83a;pointer-events:none;animation:sp 3s ease-out forwards}
@keyframes sp{to{transform:translate(var(--x),var(--y));opacity:0}}
@media (prefers-reduced-motion:reduce){.cam,.hat{transition-duration:.01s}.candle,.candle:before,.mc,.seal{animation:none}}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>

function info(b){const[y,m,d]=b.split("-").map(Number);const s=SG.find(x=>m<x[1]||(m==x[1]&&d<=x[2]))||SG[0];return{fecha:`${d} de ${MES[m-1]} de ${y}`,sign:s[0],el:s[3],h:HS[s[3]]}}
let AC,voiceOn=true,tm,runId=0,mt,mxg;
function stopAll(){runId++;clearInterval(tm);clearInterval(mt);mxg=null;try{speechSynthesis.cancel()}catch(e){}try{AC&&AC.close()}catch(e){}AC=null}
function audio(){try{AC=new(window.AudioContext||window.webkitAudioContext)();const g=AC.createGain();g.gain.setValueAtTime(.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(.05,AC.currentTime+5);g.connect(AC.destination);[110,164.8,220.4].forEach((f,i)=>{const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain();o.type=i?"sine":"triangle";o.frequency.value=f;l.frequency.value=.07+i*.04;lg.gain.value=1.6;l.connect(lg);lg.connect(o.frequency);o.connect(g);o.start();l.start()})}catch(e){}}
function music(){if(!AC)return;const ac=AC,mx=ac.createGain();mx.gain.value=.5;mxg=mx;const dl=ac.createDelay(1),fb=ac.createGain();dl.delayTime.value=.42;fb.gain.value=.38;dl.connect(fb);fb.connect(dl);mx.connect(ac.destination);mx.connect(dl);dl.connect(ac.destination);
 const SC=[164.81,185,196,220,246.94,261.63,293.66,329.63,369.99,392,440,493.88,523.25],CH=[[82.41,123.47],[65.41,98],[98,146.83],[73.42,110]],B=.95;let nxt=ac.currentTime+.3,bar=0,p=6;
 function bell(f,t,v){[1,2.01,3.97].forEach((m,j)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f*m;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v/(j*1.8+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+2.4-j*.6);o.connect(g);g.connect(mx);o.start(t);o.stop(t+2.5)})}
 mt=setInterval(()=>{if(ac.state=="closed")return;while(nxt<ac.currentTime+2){const c=CH[bar%4];bell(c[0],nxt,.14);bell(c[1],nxt+B,.06);bell(c[1]*2,nxt+2*B,.05);[0,1,2].forEach(k=>{if(k==0||Math.random()<.7){p=Math.max(2,Math.min(SC.length-1,p+[-2,-1,-1,1,1,2][Math.floor(Math.random()*6)]));bell(SC[p],nxt+k*B+(k?0:.02),.08)}});nxt+=3*B;bar++}},400)}

function copy(inp){inp.select();try{navigator.clipboard.writeText(inp.value)}catch(e){}try{document.execCommand("copy")}catch(e){}}
let last={},fromCr=false;
function creator(){
 app.innerHTML=`<main class="cr"><div class="card"><h1>Lechucería de Hogwarts</h1><p>Prepara una carta de admisión personalizada y envíala por correo.</p>
 <label>Nombre del mago o la bruja<input id="n" autocomplete="off" placeholder="Ej.: Valentina Torres"></label>

 ["n","e","b","s"].forEach(k=>{if(last[k])$("#"+k).value=last[k]});
 $("#go").onclick=()=>{
  const n=$("#n").value.trim(),e=$("#e").value.trim(),b=$("#b").value,s=$("#s").value.trim();last={n,e,b,s};

 stopAll();const my=runId,n=d.n,I=info(d.b),H=I.h,q=QL[I.sign];
 app.innerHTML=`<div class="stage" id="st" data-cam="0" style="--hc:${H.c2}"><div class="cam">${bgSVG()}<div id="cd"></div><div class="mc" id="mc">${MCG}</div><div class="stool" id="stool">${STOOL}</div></div><div class="hat" id="hat">${HAT}</div><div class="vig" id="vig"></div><div class="fade" id="fade"></div><div class="sub" id="sub"><b id="who"></b><p id="tx"></p><i id="hint">Toca para continuar</i></div><button id="snd" aria-label="Voz y sonido">🔊</button>${fromCr?'<button id="bk">← Volver al creador</button>':''}

 const cd=$("#cd");for(let i=0;i<46;i++){const c=document.createElement("div");c.className="candle";c.style.cssText=`left:${Math.random()*98}%;top:${4+Math.random()*48}%;--d:${(3+Math.random()*3).toFixed(1)}s;animation-delay:-${(Math.random()*4).toFixed(1)}s;transform:scale(${(.6+Math.random()*.6).toFixed(2)})`;cd.appendChild(c)}

 $("#seal").onclick=()=>{audio();music();$("#pp").className="paper open";$("#pp").innerHTML=`<h2>Colegio Hogwarts de Magia y Hechicería</h2><p style="text-align:center;font-size:14px">Director: Albus Dumbledore</p><p>Estimado/a ${esc(n)}:</p><p>Tenemos el placer de informarle de que dispone de una plaza en el Colegio Hogwarts de Magia y Hechicería. El curso comienza el 1 de septiembre. Esperamos su lechuza antes del 31 de julio.</p><p>Esta noche será recibido/a en el Gran Comedor para la ceremonia de selección.</p><p>Muy atentamente,<br><b>Minerva McGonagall</b><br>Subdirectora${d.s?`</p><p style="font-size:14px"><i>Lechuza enviada por ${esc(d.s)}.</i>`:""}</p><div style="text-align:center"><button class="btn" id="enter">Cruzar el umbral</button></div>`;$("#enter").onclick=()=>{$("#env").style.display="none";started=true;fade.style.opacity=0;setTimeout(()=>{if(my===runId)next()},1500)}};
